services:
  postgres:
    image: postgres:16
    container_name: monica_turnos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monica_turnos}
      POSTGRES_USER: ${POSTGRES_USER:-monica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monica123}
    expose:
      - "5432"
    volumes:
      - monica_turnos_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  api:
    build: .
    container_name: monica_turnos_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: ${PORT:-4080}
      DATABASE_URL: ${DATABASE_URL:-postgres://monica:monica123@postgres:5432/monica_turnos?sslmode=disable}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://monica.unimetatech.la}
      N8N_SYNC_WEBHOOK_URL: ${N8N_SYNC_WEBHOOK_URL:-}
      N8N_SYNC_SECRET: ${N8N_SYNC_SECRET:-}
    expose:
      - "${PORT:-4080}"

volumes:
  monica_turnos_data:
