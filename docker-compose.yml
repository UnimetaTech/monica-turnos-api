
services:
  postgres:
    image: postgres:16
    container_name: monica_turnos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: monica_turnos
      POSTGRES_USER: monica
      POSTGRES_PASSWORD: monica123
    expose:
      - "5432"
    volumes:
      - monica_turnos_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  api:
    build: .
    container_name: monica_turnos_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 8080
      DATABASE_URL: postgres://monica:monica123@postgres:5432/monica_turnos?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:5173
      N8N_SYNC_WEBHOOK_URL: ${N8N_SYNC_WEBHOOK_URL}
      N8N_SYNC_SECRET: ${N8N_SYNC_SECRET}
    ports:
      - "8080:8080"

volumes:
  monica_turnos_data:
